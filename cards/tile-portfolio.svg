<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 118" width="272" height="118" class="root" role="img">
  
  <defs>
    <linearGradient id="cardSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0D1320" />
    </linearGradient>
    <linearGradient id="brandBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="brandAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.35" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    
    .root {
      font-family: 'BrandSans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .display {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.025em;
      fill: #F8FAFC;
    }
    .title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.015em;
      fill: #F8FAFC;
    }
    .body {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0em;
      fill: #94A3B8;
    }
    .label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      fill: #64748B;
    }
    .metric {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      fill: #F8FAFC;
    }
    
        @keyframes cardReveal {
          0% { opacity: 0; transform: translateY(10px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
          0% { opacity: 0; transform: translateY(6px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
          0%, 100% { opacity: 0.95; transform: scale(1); }
          50% { opacity: 0.45; transform: scale(0.92); }
        }
        .card-enter {
          opacity: 0;
          animation: cardReveal 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.16s forwards;
        }
        .fade-up {
          opacity: 0;
          animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) calc(0.16s + var(--d, 0.12s)) forwards;
        }
        .pulse-dot {
          transform-box: fill-box;
          transform-origin: center;
          animation: pulseGlow 2.8s ease-in-out infinite;
        }
        
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition: none !important;
      }
      .card-enter, .fade-up {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>

  <rect width="272" height="118" rx="18" fill="#0B0F17" />
  <g class="card-enter">
    <rect x="1" y="1" width="270" height="116" rx="17" fill="url(#cardSurface)" stroke="url(#brandBorder)" stroke-width="1.2" />
    <rect x="1" y="1" width="270" height="116" rx="17" fill="url(#ambientGlow)" />
    <line x1="24" y1="1.2" x2="248" y2="1.2" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1" />
    
    <g class="fade-up" style="--d: 0.05s">
      <rect x="20" y="18" width="40" height="40" rx="10" fill="#1E293B" stroke="#1E293B" />
      <g transform="translate(20, 18)">
        
        <circle cx="20" cy="20" r="9" fill="none" stroke="#38BDF8" stroke-width="1.7"/>
        <ellipse cx="20" cy="20" rx="4.2" ry="9" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
        <line x1="11" y1="20" x2="29" y2="20" stroke="#38BDF8" stroke-width="1.5"/>
        
      </g>
      <text x="72" y="34" class="label" fill="#38BDF8">PORTFOLIO</text>
      <text x="242" y="36" text-anchor="end" class="body" fill="#64748B">↗</text>
    </g>
    <g class="fade-up" style="--d: 0.10s">
      <text x="20" y="80" class="title">Live Apps &amp; Web</text>
      <text x="20" y="100" class="body" font-size="12.5">sahilkumar.ai</text>
    </g>
    
  </g>
</svg>
