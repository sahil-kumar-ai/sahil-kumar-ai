<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 176" width="840" height="176" class="root" role="img">
  
  <defs>
    <linearGradient id="cardSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0D1320" />
    </linearGradient>
    <linearGradient id="brandBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="brandAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.35" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    
    .root {
      font-family: 'BrandSans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .display {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.025em;
      fill: #F8FAFC;
    }
    .title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.015em;
      fill: #F8FAFC;
    }
    .body {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0em;
      fill: #94A3B8;
    }
    .label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      fill: #64748B;
    }
    .metric {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      fill: #F8FAFC;
    }
    
        @keyframes cardReveal {
          0% { opacity: 0; transform: translateY(10px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
          0% { opacity: 0; transform: translateY(6px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
          0%, 100% { opacity: 0.95; transform: scale(1); }
          50% { opacity: 0.45; transform: scale(0.92); }
        }
        .card-enter {
          opacity: 0;
          animation: cardReveal 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.00s forwards;
        }
        .fade-up {
          opacity: 0;
          animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) calc(0.00s + var(--d, 0.12s)) forwards;
        }
        .pulse-dot {
          transform-box: fill-box;
          transform-origin: center;
          animation: pulseGlow 2.8s ease-in-out infinite;
        }
        
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition: none !important;
      }
      .card-enter, .fade-up {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>

  <rect width="840" height="176" rx="18" fill="#0B0F17" />
  <g class="card-enter">
    <rect x="1" y="1" width="838" height="174" rx="17" fill="url(#cardSurface)" stroke="url(#brandBorder)" stroke-width="1.2" />
    <rect x="1" y="1" width="838" height="174" rx="17" fill="url(#ambientGlow)" />
    <line x1="24" y1="1.2" x2="816" y2="1.2" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1" />
    
    <g class="fade-up" style="--d: 0.06s">
      <rect x="32" y="28" width="204" height="24" rx="12" fill="#1E293B" stroke="#1E293B" />
      <circle cx="46" cy="40" r="4" fill="#34D399" class="pulse-dot" />
      <text x="58" y="44" class="label" fill="#94A3B8">@sahil-kumar-ai · AI SYSTEMS</text>
    </g>
    <g class="fade-up" style="--d: 0.12s">
      <text x="32" y="92" class="display">Sahil Kumar</text>
      <text x="32" y="120" class="body">Building autonomous AI systems, scalable infrastructure, and human-agent interfaces.</text>
    </g>
    <g class="fade-up" style="--d: 0.18s">
      <text x="32" y="148" class="label" fill="#38BDF8">● Shipping multi-agent orchestrators &amp; edge inference pipelines</text>
    </g>
    
    <g class="fade-up" style="--d: 0.18s">
      <circle cx="760" cy="88" r="44" fill="#1E293B" stroke="url(#brandBorder)" stroke-width="1.5" />
      <g>
        <circle cx="760" cy="88" r="32" fill="none" stroke="url(#brandAccent)" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.75" />
        <animateTransform attributeName="transform" type="rotate" from="0 760 88" to="360 760 88" dur="24s" repeatCount="indefinite" />
      </g>
      <circle cx="760" cy="88" r="18" fill="url(#brandAccent)" opacity="0.2" />
      <text x="760" y="94" text-anchor="middle" class="title" fill="#F8FAFC">SK</text>
    </g>
    
    
  </g>
</svg>
