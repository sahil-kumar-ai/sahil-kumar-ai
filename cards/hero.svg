<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 144" width="840" height="144" class="root" role="img">
  
  <style>
    
    .root { font-family: 'BrandSans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; fill: #F4F4F5; }
    .display { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
    .title { font-size: 15px; font-weight: 500; }
    .body { font-size: 14px; font-weight: 400; fill: #A1A1AA; }
    .label { font-size: 13px; font-weight: 400; fill: #52525B; }
    .metric { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
    
    @keyframes fadeUp { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    .card-enter { opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.00s forwards; }
    .fade-up { opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) calc(0.00s + var(--d, 0.1s)) forwards; }
    
    @media (prefers-reduced-motion: reduce) { .card-enter, .fade-up { opacity: 1 !important; transform: none !important; animation: none !important; } }
  </style>

  <rect width="840" height="144" fill="#0A0A0A" />
  <g class="card-enter">
    <rect x="1" y="1" width="838" height="142" rx="16" fill="#121212" stroke="#27272A" stroke-width="1" />
    
    <g class="fade-up" style="--d: 0.05s">
      <text x="32" y="64" class="display">Sahil Kumar</text>
      <text x="32" y="90" class="body">Building autonomous AI systems, scalable infrastructure, and human-agent interfaces.</text>
    </g>
    <g class="fade-up" style="--d: 0.10s">
      <rect x="32" y="112" width="8" height="8" rx="4" fill="#52525B" />
      <text x="48" y="121" class="label">Shipping multi-agent orchestrators</text>
    </g>
    <g class="fade-up" style="--d: 0.15s"><circle cx="756" cy="72" r="48" fill="#1C1C1C" stroke="#27272A" /><text x="756" y="78" text-anchor="middle" class="title" fill="#52525B">SK</text></g>
    
  </g>
</svg>
