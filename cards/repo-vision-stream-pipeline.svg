<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 148" width="840" height="148" class="root" role="img">
  
  <defs>
    <linearGradient id="cardSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0D1320" />
    </linearGradient>
    <linearGradient id="brandBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="brandAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.35" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    
    .root {
      font-family: 'BrandSans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .display {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.025em;
      fill: #F8FAFC;
    }
    .title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.015em;
      fill: #F8FAFC;
    }
    .body {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0em;
      fill: #94A3B8;
    }
    .label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      fill: #64748B;
    }
    .metric {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      fill: #F8FAFC;
    }
    
        @keyframes cardReveal {
          0% { opacity: 0; transform: translateY(10px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
          0% { opacity: 0; transform: translateY(6px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
          0%, 100% { opacity: 0.95; transform: scale(1); }
          50% { opacity: 0.45; transform: scale(0.92); }
        }
        .card-enter {
          opacity: 0;
          animation: cardReveal 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.76s forwards;
        }
        .fade-up {
          opacity: 0;
          animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) calc(0.76s + var(--d, 0.12s)) forwards;
        }
        .pulse-dot {
          transform-box: fill-box;
          transform-origin: center;
          animation: pulseGlow 2.8s ease-in-out infinite;
        }
        
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition: none !important;
      }
      .card-enter, .fade-up {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>

  <rect width="840" height="148" rx="18" fill="#0B0F17" />
  <g class="card-enter">
    <rect x="1" y="1" width="838" height="146" rx="17" fill="url(#cardSurface)" stroke="url(#brandBorder)" stroke-width="1.2" />
    <rect x="1" y="1" width="838" height="146" rx="17" fill="url(#ambientGlow)" />
    <line x1="24" y1="1.2" x2="816" y2="1.2" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1" />
    
    <g class="fade-up" style="--d: 0.06s">
      <circle cx="40" cy="34" r="5" fill="#818CF8" />
      <text x="52" y="38" class="label" fill="#818CF8">Python / C++</text>
      <text x="150" y="38" class="label">★ 890   ⑂ 94</text>
      <text x="32" y="64" class="title" font-size="19">sahil-kumar-ai/vision-stream-pipeline</text>
      <text x="32" y="88" class="body" font-size="13.5">Sub-15ms real-time edge video inference pipeline using TensorRT, async WebRTC frame queues, and adaptive spatial batching.</text>
    </g>
    <g class="fade-up" style="--d: 0.12s">
      
        <rect x="32.0" y="104" width="67.6" height="22" rx="11" fill="#1E293B" stroke="#1E293B" />
        <text x="65.8" y="118.5" text-anchor="middle" class="label" font-size="9.5" fill="#94A3B8">edge-ai</text>
        
        <rect x="107.6" y="104" width="122.0" height="22" rx="11" fill="#1E293B" stroke="#1E293B" />
        <text x="168.6" y="118.5" text-anchor="middle" class="label" font-size="9.5" fill="#94A3B8">computer-vision</text>
        
        <rect x="237.6" y="104" width="74.4" height="22" rx="11" fill="#1E293B" stroke="#1E293B" />
        <text x="274.8" y="118.5" text-anchor="middle" class="label" font-size="9.5" fill="#94A3B8">tensorrt</text>
        
        <rect x="320.0" y="104" width="60.8" height="22" rx="11" fill="#1E293B" stroke="#1E293B" />
        <text x="350.4" y="118.5" text-anchor="middle" class="label" font-size="9.5" fill="#94A3B8">webrtc</text>
        
    </g>
    <g class="fade-up" style="--d: 0.16s">
      <text x="808" y="32" text-anchor="end" class="label" font-size="9.5">COMMIT PULSE (12W)</text>
      <polyline fill="none" stroke="url(#brandAccent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="648.0,86.0 662.5,80.4 677.1,75.7 691.6,77.6 706.2,70.1 720.7,64.5 735.3,67.3 749.8,60.7 764.4,54.2 778.9,57.0 793.5,47.6 808.0,42.0" />
    </g>
    
  </g>
</svg>
